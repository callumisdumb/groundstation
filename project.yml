name: MavicGroundStation
options:
  bundleIdPrefix: com.benmacaulay.mavic
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  MacGroundStation:
    type: application
    platform: macOS
    sources:
      - path: MacGroundStation
      - path: Shared/Protocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mavic.groundstation
  iOSFlightBridge:
    type: application
    platform: iOS
    sources:
      - path: iOSFlightBridge
      - path: Shared/Protocol
    configFiles:
      Debug: Configurations/Bridge.xcconfig
      Release: Configurations/Bridge.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benmacaulay.mavic.flightbridge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOSFlightBridge/Info.plist
