name: MavicGroundStation
options:
  bundleIdPrefix: com.benmacaulay.mavic
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
targets:
  MacGroundStation:
    type: application
    platform: macOS
    sources:
      - path: MacGroundStation
      - path: Shared/Protocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mavic.groundstation
  iOSFlightBridge:
    type: application
    platform: iOS
    sources:
      - path: iOSFlightBridge
        excludes:
          - Info.plist
          - InfoPlist-Additions.md
          - DJIWidget-Bridging-Header.h
      - path: Shared/Protocol
    configFiles:
      Debug: Configurations/BridgeDebug.xcconfig
      Release: Configurations/BridgeRelease.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benmacaulay.mavic.flightbridge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOSFlightBridge/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: iOSFlightBridge/DJIWidget-Bridging-Header.h

  BridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Bridge
      - Shared/Protocol
      - iOSFlightBridge/BridgeListener.swift
  WorkspaceTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/MacUI
    dependencies:
      - target: MacGroundStation
    settings:
      base:
        TEST_TARGET_NAME: MacGroundStation
schemes:
  GroundStationReview:
    build:
      targets:
        MacGroundStation: all
    test:
      targets:
        - BridgeTests
        - WorkspaceTests
